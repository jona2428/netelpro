[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netelpro"
version = "0.8.0"
description = "A programming language designed for LLMs — honest by construction: mechanical verification, explicit holes, no silent gaps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["llvmlite>=0.49"]
authors = [{ name = "Jonathan", email = "wolfman.agro@gmail.com" }]
keywords = ["llm", "compiler", "llvm", "dsl", "verification", "honesty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/jona2428/netelpro"

[project.scripts]
netelpro = "netelpro.__main__:main"
netelpro-mcp = "netelpro.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["netelpro*"]
exclude = ["netelpro.tests", "netelpro.tests.*"]

[tool.setuptools.package-data]
netelpro = ["spec/*.json"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = "llvmlite.*"
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# E741: `l`/`r` are the deliberate Clojure-style names for AND/OR AST nodes
# and parser locals (`(and l r)`); renaming them would churn core files.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Tests insert the repo root into sys.path before importing the package:
# imports after statements are the structural pattern, not an accident.
"tests/*" = ["E402"]
