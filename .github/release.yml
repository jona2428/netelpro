  "tag_name": "v0.2.0",
  "name": "Netelpro v0.2.0 — Bool Params at the Native Boundary",
  "body": "## What's new\n\n**Bool params (i1) at the native boundary.** Gate rules can now take Python `bool` arguments directly: a parameter used as an `if`/`and`/`or`/`not` operand compiles to a native 1-bit LLVM param and crosses the machine boundary via `ctypes.c_bool` (low-byte ABI read). Unused / Int-context parameters remain `c_int64`. Mixed use of the same parameter (Bool demanded in one site, Int in another) remains a compile error with exact coordinates.\n\n- Per-parameter ctypes prototypes are built from the **compiler-resolved** LLVM signature — the bridge no longer duplicates type inference (the AST-walk heuristic `_has_non_int_param` is gone).\n- `verify()` differential testing now serializes Python bools as the Netelpro literals `true`/`false` on the interpreter side.\n- TCO verified with an `i1` slot: 500k tail-call levels, constant stack, native == interpreter.\n\n### Prosecution (sharpened, not relaxed)\n\nThe same honesty stack applies: parse → caps → holes → codegen. What changed is *scope*: the Int-only boundary limit of v0.1 is lifted; type-conflict prosecution is unchanged (`type mismatch` with `line:col`).\n\n### Verification\n\n- Full suite: **322/322 green** (304 prior + 18 new), zero differential mismatches\n- Rule-filter bridge: 19/19\n- Real consumer (Neuromancer zone-policy gate): 27/27, fully back-compatible\n- CI: green on `fa480a4`\n\n### Install\n\n```bash\ngit clone https://github.com/jona2428/netelpro.git\ncd netelpro\npip install -e \".[dev]\"\n```\n\nRequires Python 3.11+. The interpreter needs nothing beyond CPython; the native backend needs `llvmlite 0.49`.\n\n### Deliberate limits (documented, not accidental)\n\n- Compiled subset: `Int`/`Bool` (Str/Float/List native backends deferred to demand)\n- Recursion must be tail-recursive to compile\n- No first-class functions\n- Capabilities are file-scoped (`{io}`)\n",\n  "draft": false,
  "prerelease": false
}
